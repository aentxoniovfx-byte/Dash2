<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Call Goal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}
:root{--bg:#050a18;--text:#eef4ff;--muted:#91a0bd;--accent:#6366f1;--accent2:#38bdf8;--goal:#a7f3d0}
body{min-height:100vh;padding:28px;background:radial-gradient(circle at 20% 20%,rgba(99,102,241,.20),transparent 42%),radial-gradient(circle at 80% 75%,rgba(56,189,248,.12),transparent 48%),var(--bg);color:var(--text);display:grid;place-items:center}
.dashboard{width:min(940px,100%)}
.header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}
.eyebrow{color:var(--accent2);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}
h1{font-size:clamp(1.65rem,4vw,2.4rem)}
.date{color:var(--muted);font-size:.9rem}
.panel{position:relative;overflow:hidden;display:grid;grid-template-columns:220px 1fr;gap:34px;padding:32px;border:1px solid rgba(255,255,255,.11);border-radius:30px;background:rgba(255,255,255,.045);box-shadow:0 22px 60px rgba(0,0,0,.25);backdrop-filter:blur(16px)}
.thermometer-wrap{display:flex;justify-content:center;align-items:center;min-height:430px}
.thermometer{position:relative;width:92px;height:360px}
.tube{position:absolute;left:22px;top:0;width:48px;height:300px;border:4px solid rgba(255,255,255,.22);border-bottom:0;border-radius:28px 28px 0 0;background:rgba(255,255,255,.035);overflow:hidden}
.mercury{position:absolute;left:6px;right:6px;bottom:0;height:0;border-radius:18px 18px 0 0;background:linear-gradient(to top,var(--fill1),var(--fill2));transition:height .6s cubic-bezier(.2,.8,.2,1),background .4s}
.bulb{position:absolute;left:7px;bottom:0;width:78px;height:78px;border:4px solid rgba(255,255,255,.22);border-radius:50%;background:var(--fill1);box-shadow:0 0 36px color-mix(in srgb,var(--fill1) 42%,transparent);transition:.4s}
.bulb:after{content:"";position:absolute;width:24px;height:55px;left:23px;top:-32px;background:var(--fill1)}
.goal-mark{position:absolute;left:75px;top:-7px;color:var(--goal);font-size:.78rem;font-weight:800;white-space:nowrap}
.scale{position:absolute;right:78px;top:4px;height:292px;display:flex;flex-direction:column;justify-content:space-between;color:var(--muted);font-size:.7rem;text-align:right}
.content{display:flex;flex-direction:column;justify-content:center}
.visual-count{position:relative;width:230px;height:230px;display:grid;place-items:center;margin-bottom:18px}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 14px color-mix(in srgb,var(--fill1) 35%,transparent))}
.ring-bg,.ring-fill{fill:none;stroke-width:10}.ring-bg{stroke:rgba(255,255,255,.07)}
.ring-fill{stroke:url(#ringGradient);stroke-linecap:round;stroke-dasharray:565.49;stroke-dashoffset:565.49;transition:stroke-dashoffset .65s cubic-bezier(.2,.8,.2,1)}
.ring-center{text-align:center;z-index:1}.ring-caption{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:8px}
.status-pill{align-self:flex-start;padding:8px 12px;border:1px solid color-mix(in srgb,var(--fill1) 55%,transparent);border-radius:999px;background:color-mix(in srgb,var(--fill1) 14%,transparent);color:var(--fill2);font-size:.8rem;font-weight:700;margin-bottom:20px;transition:.4s}
.count-row{display:flex;align-items:baseline;justify-content:center;gap:5px}
.count{font-size:4.6rem;font-weight:800;letter-spacing:-.08em;line-height:.88;color:var(--fill2);transition:.35s}
.target{color:var(--muted);font-size:1rem;font-weight:600}
.message{font-size:1.15rem;font-weight:600;margin-top:18px}
.remaining{color:var(--muted);font-size:.9rem;margin-top:7px}
.progress-track{height:12px;margin:26px 0 10px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden}
.progress-fill{height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--fill1),var(--fill2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.progress-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem}
.milestones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:23px;position:relative}
.milestones:before{content:"";position:absolute;top:18px;left:10%;right:10%;height:2px;background:rgba(255,255,255,.08)}
.milestone{position:relative;text-align:center;color:var(--muted);font-size:.68rem;font-weight:650;transition:.35s}
.milestone-dot{position:relative;z-index:1;width:36px;height:36px;margin:0 auto 7px;display:grid;place-items:center;border-radius:50%;border:2px solid rgba(255,255,255,.12);background:#0b1224;color:var(--muted);transition:.35s}
.milestone.done{color:var(--text)}.milestone.done .milestone-dot{border-color:var(--fill2);background:var(--fill1);color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--fill1) 45%,transparent)}
.flash{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle at 70% 45%,color-mix(in srgb,var(--fill2) 20%,transparent),transparent 45%);transition:opacity .25s}.flash.show{opacity:1}
.plus-one{position:fixed;z-index:20;color:var(--fill2);font-size:1.4rem;font-weight:800;pointer-events:none;animation:floatUp .8s ease-out forwards;text-shadow:0 0 16px var(--fill1)}
@keyframes floatUp{from{transform:translateY(0) scale(.8);opacity:0}35%{opacity:1}to{transform:translateY(-70px) scale(1.18);opacity:0}}
.actions{display:grid;grid-template-columns:1fr 1.65fr;gap:12px;margin-top:30px}
button{border:1px solid rgba(255,255,255,.11);border-radius:18px;padding:17px;color:white;font-size:1rem;font-weight:750;cursor:pointer;transition:.18s;background:rgba(255,255,255,.07)}
button:hover{transform:translateY(-2px);filter:brightness(1.12)}
button:active{transform:scale(.98)}
.add{background:linear-gradient(135deg,color-mix(in srgb,var(--fill1) 65%,#11182c),color-mix(in srgb,var(--fill2) 48%,#11182c));font-size:1.08rem}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:.76rem}
.reset{padding:7px 10px;border:0;background:transparent;color:var(--muted);font-size:.76rem}
.celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti{position:absolute;top:-15px;width:9px;height:15px;border-radius:2px;animation:fall 2.3s linear forwards}
@keyframes fall{to{transform:translate3d(var(--drift),105vh,0) rotate(760deg);opacity:.15}}
@media(max-width:680px){body{padding:18px}.header{align-items:start;flex-direction:column}.panel{grid-template-columns:1fr;padding:24px;gap:4px}.thermometer-wrap{min-height:260px}.thermometer{transform:scale(.68);height:285px}.content{text-align:center}.visual-count{margin-inline:auto;width:210px;height:210px}.status-pill{align-self:center}.actions{grid-template-columns:1fr 1.5fr}.milestone{font-size:.6rem}}
</style>
</head>
<body>
<main class="dashboard" id="dashboard">
  <header class="header">
    <div><div class="eyebrow">Daily performance</div><h1>📞 Call Goal</h1></div>
    <div class="date" id="dateLabel"></div>
  </header>
  <section class="panel" id="panel">
    <div class="flash" id="flash"></div>
    <div class="thermometer-wrap">
      <div class="thermometer">
        <div class="scale"><span>90</span><span>68</span><span>45</span><span>23</span><span>0</span></div>
        <div class="tube"><div class="mercury" id="mercury"></div></div>
        <div class="bulb"></div><div class="goal-mark">GOAL 90</div>
      </div>
    </div>
    <div class="content">
      <div class="status-pill" id="statusPill">Ready to start</div>
      <div class="visual-count">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <defs><linearGradient id="ringGradient"><stop id="ringStop1" offset="0%"/><stop id="ringStop2" offset="100%"/></linearGradient></defs>
          <circle class="ring-bg" cx="100" cy="100" r="90"/>
          <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="90"/>
        </svg>
        <div class="ring-center"><div class="count-row"><div class="count" id="count">0</div><div class="target">/90</div></div><div class="ring-caption">Calls today</div></div>
      </div>
      <div class="message" id="message">Let's get the first call!</div>
      <div class="remaining" id="remaining">90 calls remaining</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-labels"><span id="percent">0% complete</span><span id="pace">Starting line</span></div>
      <div class="milestones">
        <div class="milestone" data-at="23"><div class="milestone-dot">25%</div><span>Warm-up</span></div>
        <div class="milestone" data-at="45"><div class="milestone-dot">50%</div><span>Halfway</span></div>
        <div class="milestone" data-at="68"><div class="milestone-dot">75%</div><span>Strong</span></div>
        <div class="milestone" data-at="90"><div class="milestone-dot">✓</div><span>Goal</span></div>
      </div>
      <div class="actions">
        <button onclick="changeCount(-1)" aria-label="Remove one call">− Remove</button>
        <button class="add" onclick="changeCount(1,event)">＋ Add Call</button>
      </div>
    </div>
  </section>
  <div class="footer"><span>Progress saves automatically and resets on a new day.</span><button class="reset" onclick="resetCount()">Reset today</button></div>
</main>
<div class="celebration" id="celebration"></div>
<script>
const GOAL=90;
const STORAGE_KEY="dailyCallGoal90";
const today=()=>new Date().toLocaleDateString("en-CA");
let state={date:today(),count:0,celebrated:false};

function load(){
  try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved?.date===today())state={...state,...saved};}
  catch(error){console.warn("Saved progress could not be loaded.",error);}
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function palette(percent){
  if(percent>=100)return["#10b981","#a7f3d0"];
  if(percent>=75)return["#22c55e","#86efac"];
  if(percent>=50)return["#06b6d4","#67e8f9"];
  if(percent>=25)return["#6366f1","#60a5fa"];
  return["#7c3aed","#818cf8"];
}
function copyFor(count,percent){
  if(percent>=100)return["Goal reached! 🏆",`${count-GOAL} calls above goal`,"Daily goal complete"];
  if(percent>=90)return["Final push — almost there! 🔥",`${GOAL-count} calls remaining`,"Almost there"];
  if(percent>=75)return["Great momentum! ⚡",`${GOAL-count} calls remaining`,"Strong progress"];
  if(percent>=50)return["Halfway and moving! 🚀",`${GOAL-count} calls remaining`,"On the way"];
  if(percent>=25)return["Good start — keep it going! 📈",`${GOAL-count} calls remaining`,"Building momentum"];
  if(count>0)return["Every call moves the goal! 🎯",`${GOAL-count} calls remaining`,"Getting started"];
  return["Let's get the first call!",`${GOAL} calls remaining`,"Ready to start"];
}
function render(){
  const rawPercent=(state.count/GOAL)*100;
  const visualPercent=Math.min(rawPercent,100);
  const [fill1,fill2]=palette(rawPercent);
  document.documentElement.style.setProperty("--fill1",fill1);
  document.documentElement.style.setProperty("--fill2",fill2);
  document.getElementById("count").textContent=state.count;
  document.getElementById("mercury").style.height=`${visualPercent}%`;
  document.getElementById("progressFill").style.width=`${visualPercent}%`;
  document.getElementById("ringFill").style.strokeDashoffset=565.49-(565.49*visualPercent/100);
  document.getElementById("ringStop1").setAttribute("stop-color",fill1);
  document.getElementById("ringStop2").setAttribute("stop-color",fill2);
  document.getElementById("percent").textContent=`${Math.round(rawPercent)}% complete`;
  document.getElementById("pace").textContent=rawPercent>=100?"Goal achieved":rawPercent>=75?"Final stretch":rawPercent>=50?"Past halfway":rawPercent>=25?"Gaining pace":"Starting line";
  const [message,remaining,status]=copyFor(state.count,rawPercent);
  document.getElementById("message").textContent=message;
  document.getElementById("remaining").textContent=remaining;
  document.getElementById("statusPill").textContent=status;
  document.querySelectorAll(".milestone").forEach(item=>item.classList.toggle("done",state.count>=Number(item.dataset.at)));
  document.getElementById("dateLabel").textContent=new Date().toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric"});
}
function changeCount(amount,event){
  const before=state.count;
  state.count=Math.max(0,state.count+amount);
  if(amount>0){showPlus(event);pulsePanel();}
  if(before<GOAL&&state.count>=GOAL&&!state.celebrated){celebrate();state.celebrated=true;}
  if(state.count<GOAL)state.celebrated=false;
  save();render();
}
function pulsePanel(){const flash=document.getElementById("flash");flash.classList.add("show");setTimeout(()=>flash.classList.remove("show"),240);}
function showPlus(event){const el=document.createElement("div");el.className="plus-one";el.textContent="+1";const x=event?.clientX||innerWidth*.72;const y=event?.clientY||innerHeight*.72;el.style.left=`${x-10}px`;el.style.top=`${y-25}px`;document.body.appendChild(el);setTimeout(()=>el.remove(),850);}
function resetCount(){
  if(!confirm("Reset today's call count to zero?"))return;
  state={date:today(),count:0,celebrated:false};save();render();
}
function celebrate(){
  const box=document.getElementById("celebration");
  const colors=["#a7f3d0","#38bdf8","#818cf8","#fbbf24","#f472b6"];
  for(let i=0;i<80;i++){
    const piece=document.createElement("span");piece.className="confetti";
    piece.style.left=`${Math.random()*100}%`;piece.style.background=colors[i%colors.length];
    piece.style.animationDelay=`${Math.random()*.6}s`;piece.style.setProperty("--drift",`${(Math.random()-.5)*240}px`);
    box.appendChild(piece);setTimeout(()=>piece.remove(),3200);
  }
}
load();render();
</script>
</body>
</html>
